# Portfolio Serah Aouate — service statique derrière le Caddy du serveur.
# Caddy termine le TLS et compresse ; nginx ne sert que les fichiers.

server {
    listen      3004;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Ne PAS ajouter de bloc `types { … }` ici : il remplacerait toute la table
    # MIME héritée au lieu de l'étendre, et le HTML repartirait en
    # application/octet-stream. La table de /etc/nginx/mime.types déclare déjà
    # image/webp (depuis nginx 1.11).

    # Le HTML doit toujours être revalidé : c'est lui qui pointe vers les
    # assets hachés. Sinon un visiteur garde une page qui référence des
    # fichiers supprimés au déploiement suivant.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets produits par Vite : nom haché, donc immuables
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Compression : utile si nginx est un jour exposé sans Caddy devant
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;
    # pas de gzip sur webp/jpeg : déjà compressés

    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
